name: daily-route

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: daily-route-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailyroute
      POSTGRES_PASSWORD: dailyroute
      POSTGRES_DB: dailyroute
      # The image already ships the pgvector extension; this only pre-creates it.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # 5433 on the host: 5432 is already taken by another local stack.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyroute -d dailyroute"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
