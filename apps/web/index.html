<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Plan a journey on Transjakarta, MRT Jakarta, LRT Jakarta, LRT Jabodebek, and KRL Jabodetabek, and see which lines are closed."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#17140F" />
    <title>Daily Route: Jabodetabek transit</title>
    <script>
      // The theme is resolved before the first paint so the page never
      // flashes the wrong colours.
      (function () {
        try {
          var stored = localStorage.getItem("daily-route-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
