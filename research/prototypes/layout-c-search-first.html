<title>Daily Route — Konsep C: cari dulu, peta setelah hasil</title>
<style>
/* ==========================================================================
   Daily Route — Konsep C (search first)
   Sumber angka: research/ux-layout-patterns.spec.json
   ========================================================================== */

:root {
  --bg: #fbfaf8;
  --surface: #ffffff;
  --surface-2: #f4f2ee;
  --surface-3: #ebe8e1;
  --ink: #17150f;
  --ink-2: #4a4740;
  --ink-3: #6f6b61;
  --line: #e5e1d8;
  --line-strong: #cfcabe;
  --accent: #0b6b4f;
  --accent-hover: #095a42;
  --accent-ink: #ffffff;
  --accent-soft: #e6f1ec;

  --mode-bus: #1d4ed8;
  --mode-metro: #b91c1c;
  --mode-tram: #b45309;
  --mode-lrt-jabodebek: #0e7490;
  --mode-rail: #334155;

  --shadow-pop: 0 2px 6px rgb(23 21 15 / 0.08), 0 18px 48px -18px rgb(23 21 15 / 0.3);
  --shadow-raised: 0 1px 2px rgb(23 21 15 / 0.12);
  --radius-card: 14px;

  /* Angka spesifikasi konsep C */
  --appbar-h: 0px;      /* tidak ada app bar */
  --form-w: 480px;      /* kolom pencarian, desktop */
  --dock-h: 104px;      /* dock hasil ringkas, desktop */
  --card-h: 190px;      /* kartu hasil ringkas, mobile */
  --radius: 14px;
  --bp: 900px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}

/* Harness peramban */
.harness { position: sticky; top: 0; z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.harness__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.harness__title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.harness__title span { font-weight: 400; color: var(--ink-3); }
.harness__seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.harness__seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; min-height: 32px;
}
.harness__seg button + button { border-left: 1px solid var(--line); }
.harness__seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.harness__note { font-size: 12px; color: var(--ink-3); }

.stage { display: grid; gap: 24px; padding: 24px; align-items: start; }
.stage[data-mode="desktop"], .stage[data-mode="mobile"] { grid-template-columns: minmax(0, 1fr); }
.stage[data-mode="both"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.frame-wrap { min-width: 0; }
.frame-wrap[hidden] { display: none; }
.frame-label { font-size: 12px; color: var(--ink-3); margin: 0 0 6px 2px; }
.frame-clip { overflow: hidden; }
.frame {
  position: relative; overflow: hidden; background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-raised);
  transform-origin: top left; container-type: inline-size;
}
.frame--desktop { width: 1440px; height: 900px; }
.frame--mobile { width: 390px; height: 844px; }

/* Aplikasi */
.app { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.brand { position: absolute; top: 20px; left: 24px; z-index: 4; display: flex; align-items: center; gap: 8px; }
.brand__mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
.brand__name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

/* ---- Layar pencarian ---- */
.search-screen { position: absolute; inset: 0; display: grid; grid-template-columns: var(--form-w) minmax(0, 1fr); }
.search-pane { padding: 68px 40px 32px 24px; display: flex; flex-direction: column; min-width: 0; }
.search-pane h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 6px; }
.search-pane .lede { font-size: 13px; color: var(--ink-2); margin: 0 0 24px; max-width: 34ch; }
.search { display: flex; flex-direction: column; gap: 6px; }
.field {
  display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; min-height: 52px;
}
.field:focus-within { border-color: var(--accent); }
.field__label { font-size: 12px; color: var(--ink-3); }
.field__value { font-size: 15px; }
.field__value.is-empty { color: var(--ink-3); }
.dot { width: 10px; height: 10px; border-radius: 9999px; }
.dot--origin { background: var(--ink); }
.dot--dest { background: var(--accent); }
.search__actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.btn {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 0 14px; min-height: 40px; display: inline-flex;
  align-items: center; gap: 6px;
}
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn--primary:hover { background: var(--accent-hover); }
.btn--quiet { background: transparent; color: var(--ink-2); border-color: transparent; }
.assistant-note { font-size: 12px; color: var(--ink-3); margin-top: 10px; }
.recents { margin-top: 28px; }
.recents__title { font-size: 12px; color: var(--ink-3); margin: 0 0 8px; }
.recent {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line);
  padding: 10px 2px; cursor: pointer; font: inherit; color: var(--ink);
}
.recent__from { font-size: 15px; font-weight: 600; }
.recent__to { font-size: 13px; color: var(--ink-2); }
.recent__meta { margin-left: auto; font-size: 12px; color: var(--ink-3); }

/* Panel kanan: diagram jaringan, bukan peta */
.network {
  border-left: 1px solid var(--line); background: var(--surface);
  padding: 68px 48px 32px 40px; display: flex; flex-direction: column; justify-content: center; gap: 20px;
}
.network__title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.network__sub { font-size: 13px; color: var(--ink-2); margin: 0; max-width: 48ch; }
.network svg { width: 100%; height: auto; display: block; }
.network__legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink-2); }
.network__legend span { display: flex; align-items: center; gap: 6px; }
.network__legend i { display: block; width: 18px; height: 3px; border-radius: 9999px; }

/* ---- Layar hasil ---- */
.map { position: absolute; inset: 0; }
.map__svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.map__svg--mobile { display: none; }
.map-controls { position: absolute; top: 20px; right: 20px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
.map-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-raised);
  display: grid; place-items: center; cursor: pointer; font-size: 13px;
}
.pill {
  position: absolute; top: 20px; left: 20px; z-index: 4; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9999px;
  box-shadow: var(--shadow-raised); padding: 6px 8px 6px 14px; font-size: 13px;
}
.pill__route { color: var(--ink); font-weight: 600; }
.pill button { appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); font: inherit; font-size: 12px; border-radius: 9999px; padding: 4px 10px; min-height: 28px; cursor: pointer; }

/* Dock hasil ringkas, desktop */
.dock {
  position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 5;
  height: var(--dock-h); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-pop);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 24px; align-items: center;
  padding: 0 20px;
}
.dock__time { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 0; }
.dock__meta { font-size: 12px; color: var(--ink-2); margin: 0; }
.dock__fare { font-size: 13px; color: var(--ink-2); }
.ribbon { display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; }
.ribbon__leg { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.ribbon__badge {
  width: 24px; height: 24px; border-radius: 9999px; color: #ffffff; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; flex: 0 0 auto;
}
.ribbon__sep { width: 14px; height: 2px; background: var(--line); flex: 0 0 auto; }
.dock__actions { display: flex; align-items: center; gap: 8px; }

/* Kartu hasil ringkas, mobile */
.card {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5;
  height: var(--card-h); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-pop);
  padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;
}
.card__row { display: flex; align-items: baseline; gap: 10px; }
.card__time { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.card__meta { font-size: 12px; color: var(--ink-2); }
.ribbon__min { color: var(--ink-2); }

@container (max-width: 899px) {
  .search-screen { grid-template-columns: minmax(0, 1fr); }
  .search-pane { padding: 60px 16px 16px; }
  .network { border-left: 0; border-top: 1px solid var(--line); padding: 20px 16px 24px; }
  .brand { top: 12px; left: 16px; }
  .pill { top: 12px; left: 12px; right: 12px; border-radius: 12px; padding: 8px 8px 8px 12px; }
  .map__svg--desktop { display: none; }
  .map__svg--mobile { display: block; }
  .map-controls { top: 60px; right: 12px; flex-direction: row; }
  .dock {
    left: 12px; right: 12px; bottom: 12px; height: var(--card-h);
    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto;
    gap: 10px; padding: 12px 14px; align-items: start;
  }
  .dock__time { font-size: 28px; }
  .dock__actions { justify-content: flex-end; }
  .ribbon__min { display: none; }
  .map-btn { width: 36px; height: 36px; }
}
</style>
</head>

<script>
(function () {
  var stage = document.querySelector(".stage");
  var searchTpl = document.getElementById("tpl-search");
  var resultTpl = document.getElementById("tpl-result");
  var wraps = Array.prototype.slice.call(document.querySelectorAll(".frame-wrap"));

  wraps.forEach(function (wrap) {
    var frame = wrap.querySelector(".frame");
    var kind = frame.getAttribute("data-frame");
    var tpl = kind.indexOf("search") !== -1 ? searchTpl : resultTpl;
    frame.appendChild(tpl.content.cloneNode(true));
  });

  function layout() {
    var mode = stage.getAttribute("data-mode");
    wraps.forEach(function (wrap) {
      var device = wrap.getAttribute("data-device");
      var visible = mode === "both" || mode === device;
      wrap.hidden = !visible;
      if (!visible) return;
      var frame = wrap.querySelector(".frame");
      var fw = frame.offsetWidth, fh = frame.offsetHeight;
      var avail = wrap.clientWidth || fw;
      var scale = Math.min(1, avail / fw);
      frame.style.transform = "scale(" + scale + ")";
      var clip = wrap.querySelector(".frame-clip");
      clip.style.width = Math.round(fw * scale) + "px";
      clip.style.height = Math.round(fh * scale) + "px";
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".harness__seg button[data-mode]"), function (btn) {
    btn.addEventListener("click", function () {
      stage.setAttribute("data-mode", btn.getAttribute("data-mode"));
      Array.prototype.forEach.call(document.querySelectorAll(".harness__seg button[data-mode]"), function (other) {
        other.setAttribute("aria-pressed", other === btn ? "true" : "false");
      });
      layout();
    });
  });

  window.addEventListener("resize", layout);
  layout();
})();
</script>
