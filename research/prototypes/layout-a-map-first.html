<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Route — Konsep A: peta pertama, panel mengambang</title>
<style>
/* ==========================================================================
   Daily Route — Konsep A (map-first, panel mengambang)
   Sumber angka: research/ux-layout-patterns.spec.json
   Palet dan tipografi mengikuti DESIGN.md. Tanpa build, tanpa CDN, tanpa font
   eksternal. Semua ukuran dalam px.
   ========================================================================== */

:root {
  --bg: #fbfaf8;
  --surface: #ffffff;
  --surface-2: #f4f2ee;
  --surface-3: #ebe8e1;
  --ink: #17150f;
  --ink-2: #4a4740;
  --ink-3: #6f6b61;
  --line: #e5e1d8;
  --line-strong: #cfcabe;
  --accent: #0b6b4f;
  --accent-hover: #095a42;
  --accent-ink: #ffffff;
  --accent-soft: #e6f1ec;

  --mode-bus: #1d4ed8;
  --mode-metro: #b91c1c;
  --mode-tram: #b45309;
  --mode-lrt-jabodebek: #0e7490;
  --mode-rail: #334155;

  --shadow-pop: 0 2px 6px rgb(23 21 15 / 0.08), 0 18px 48px -18px rgb(23 21 15 / 0.3);
  --shadow-raised: 0 1px 2px rgb(23 21 15 / 0.12);
  --radius-card: 14px;
  --map-halo: rgb(23 21 15 / 0.14);

  /* Angka spesifikasi konsep A */
  --appbar-h: 0px;      /* tidak ada app bar */
  --panel-w: 400px;     /* panel hasil mengambang, desktop */
  --search-w: 420px;    /* kartu search melayang, desktop */
  --radius: 14px;
  --bp: 900px;          /* compact | expanded */
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* --------------------------------------------------------------------------
   Harness peramban (bukan bagian dari aplikasi)
   -------------------------------------------------------------------------- */

.harness {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
}
.harness__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.harness__title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.harness__title span { font-weight: 400; color: var(--ink-3); }
.harness__seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.harness__seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; min-height: 32px;
}
.harness__seg button + button { border-left: 1px solid var(--line); }
.harness__seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.harness__note { font-size: 12px; color: var(--ink-3); }

.stage { display: grid; gap: 24px; padding: 24px; align-items: start; }
.stage[data-mode="desktop"], .stage[data-mode="mobile"] { grid-template-columns: minmax(0, 1fr); }
.stage[data-mode="both"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.frame-wrap { min-width: 0; }
.frame-wrap[hidden] { display: none; }
.frame-label { font-size: 12px; color: var(--ink-3); margin: 0 0 6px 2px; }
.frame-clip { overflow: hidden; }
.frame {
  position: relative; overflow: hidden; background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow-raised);
  transform-origin: top left;
  container-type: inline-size;
}
.frame--desktop { width: 1440px; height: 900px; }
.frame--mobile { width: 390px; height: 844px; }

/* --------------------------------------------------------------------------
   Aplikasi
   -------------------------------------------------------------------------- */

.app { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }

.map { position: absolute; inset: 0; }
.map__svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.map__svg--mobile { display: none; }

/* Kontrol peta di kanan atas: tema, lokasi, lapisan. */
.map-controls {
  position: absolute; top: 20px; right: 20px; z-index: 3;
  display: flex; flex-direction: column; gap: 8px;
}
.map-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-raised);
  display: grid; place-items: center; cursor: pointer; font-size: 13px;
}
.map-legend {
  position: absolute; right: 20px; bottom: 20px; z-index: 3;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow-raised); padding: 8px 10px;
  display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2);
}
.map-legend span { display: flex; align-items: center; gap: 6px; }
.map-legend i { display: block; width: 18px; height: 3px; border-radius: 9999px; }

/* Kartu search melayang di kiri atas. */
.search-card {
  position: absolute; left: 20px; top: 20px; z-index: 4;
  width: var(--search-w); max-width: calc(100% - 40px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-pop);
  padding: 12px;
}
.search-card__fields { display: flex; flex-direction: column; gap: 6px; }
.field {
  display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: center;
  background: var(--surface-2); border: 1px solid transparent; border-radius: 10px;
  padding: 8px 10px; min-height: 44px;
}
.field:focus-within { border-color: var(--accent); background: var(--surface); }
.field__label { font-size: 12px; color: var(--ink-3); }
.field__value { font-size: 15px; color: var(--ink); }
.field__value.is-empty { color: var(--ink-3); }
.dot { width: 10px; height: 10px; border-radius: 9999px; }
.dot--origin { background: var(--ink); }
.dot--dest { background: var(--accent); }
.field-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.btn {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 0 12px; min-height: 36px; display: inline-flex;
  align-items: center; gap: 6px;
}
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; flex: 1; justify-content: center; }
.btn--primary:hover { background: var(--accent-hover); }
.btn--quiet { background: transparent; color: var(--ink-2); border-color: transparent; }
.search-card__note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }

/* Panel hasil mengambang di kiri bawah. */
.results {
  position: absolute; left: 20px; bottom: 20px; z-index: 4;
  width: var(--panel-w); max-width: calc(100% - 40px);
  max-height: 58%; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-pop);
}
.results__fade {
  position: absolute; left: 1px; right: 1px; bottom: 1px; height: 32px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0), var(--surface));
  border-radius: 0 0 var(--radius) var(--radius);
}
.results__head { flex: 0 0 auto; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
.results__eyebrow { font-size: 12px; color: var(--ink-3); }
.results__title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.results__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 14px 14px; }

.summary { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary__time { font-size: 40px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.summary__meta { font-size: 13px; color: var(--ink-2); }
.summary__fare { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

.alts { margin: 12px 0 4px; display: flex; flex-direction: column; gap: 6px; }
.alt {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface);
}
.alt[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.alt__time { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.alt__meta { font-size: 12px; color: var(--ink-3); }
.alt__tag { font-size: 12px; color: var(--ink-2); }

.legs { list-style: none; margin: 12px 0 0; padding: 0; }
.leg { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding-bottom: 12px; position: relative; }
.leg:not(:last-child)::before {
  content: ""; position: absolute; left: 9px; top: 18px; bottom: 0; width: 2px; background: var(--line);
}
.leg__icon { width: 24px; height: 24px; border-radius: 9999px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #ffffff; z-index: 1; }
.leg__icon--walk { background: var(--ink-3); }
.leg__icon--bus { background: var(--mode-bus); }
.leg__icon--lrt { background: var(--mode-lrt-jabodebek); }
.leg__title { font-size: 15px; font-weight: 600; }
.leg__sub { font-size: 12px; color: var(--ink-3); }
.leg__time { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.leg--transfer .leg__title { font-weight: 500; color: var(--ink-2); font-size: 13px; }

.legend-inline { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); }
.legend-inline span { display: flex; align-items: center; gap: 6px; }
.legend-inline i { display: block; width: 18px; height: 3px; border-radius: 9999px; }

/* --------------------------------------------------------------------------
   Compact (mobile 390 x 844)
   -------------------------------------------------------------------------- */
@container (max-width: 899px) {
  .search-card {
    left: 12px; right: 12px; top: 12px; width: auto; max-width: none;
    padding: 10px; border-radius: 12px;
  }
  .results {
    left: 12px; right: 12px; bottom: 12px; width: auto; max-width: none;
    max-height: 46%; border-radius: 12px;
  }
  .map__svg--desktop { display: none; }
  .map__svg--mobile { display: block; }
  .map-controls { top: 12px; right: 12px; flex-direction: row; }
  .map-btn { width: 36px; height: 36px; }
  .map-legend { display: none; }
  .summary__time { font-size: 28px; }
  .results__head { padding: 10px 12px 8px; }
  .results__body { padding: 8px 12px 12px; }
}
</style>
</head>

</div>

</div>

<script>
/* --------------------------------------------------------------------------
   Peramban: menyalin kerangka ke dua bingkai dan menghitung skala tampilan.
   Tidak mengubah isi kerangka aplikasi.
   -------------------------------------------------------------------------- */
(function () {
  var stage = document.querySelector(".stage");
  var tpl = document.getElementById("tpl-app");
  var wraps = Array.prototype.slice.call(document.querySelectorAll(".frame-wrap"));

  wraps.forEach(function (wrap) {
    var frame = wrap.querySelector(".frame");
    frame.appendChild(tpl.content.cloneNode(true));
  });

  function layout() {
    var mode = stage.getAttribute("data-mode");
    wraps.forEach(function (wrap) {
      var device = wrap.getAttribute("data-device");
      var visible = mode === "both" || mode === device;
      wrap.hidden = !visible;
      if (!visible) return;
      var frame = wrap.querySelector(".frame");
      var fw = frame.offsetWidth, fh = frame.offsetHeight;
      var avail = wrap.clientWidth || fw;
      var scale = Math.min(1, avail / fw);
      frame.style.transform = "scale(" + scale + ")";
      var clip = wrap.querySelector(".frame-clip");
      clip.style.width = Math.round(fw * scale) + "px";
      clip.style.height = Math.round(fh * scale) + "px";
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".harness__seg button"), function (btn) {
    btn.addEventListener("click", function () {
      stage.setAttribute("data-mode", btn.getAttribute("data-mode"));
      Array.prototype.forEach.call(document.querySelectorAll(".harness__seg button"), function (other) {
        other.setAttribute("aria-pressed", other === btn ? "true" : "false");
      });
      layout();
    });
  });

  window.addEventListener("resize", layout);
  layout();
})();
</script>
